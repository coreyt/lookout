schema_version: 2

pattern:
  id: "DI-001"
  title: "Dependency Injection via Constructor"
  description: |
    Classes should receive dependencies through their constructor parameters
    rather than creating them internally. This enables testing with mocks,
    improves flexibility, and makes dependency relationships explicit.
  rationale: |
    Hard-coded dependencies make classes difficult to test in isolation,
    tightly couple components, and hide the dependency graph. Constructor
    injection makes dependencies visible and swappable.
  version: "1.0.0"
  tier: 2
  category: "architecture"
  subcategory: "dependency-injection"
  severity: "warning"
  tags:
    - solid
    - testability
    - decoupling

  reporting:
    default_message: "Direct dependency instantiation in constructor — use injection instead (DI-001)"
    confidence: "medium"

  references:
    - "https://martinfowler.com/articles/injection.html"
    - "https://en.wikipedia.org/wiki/Dependency_injection"

  status: "active"
  paths:
    exclude:
      - "tests/**"
      - "test/**"
      - "**/test_*.py"
      - "**/*_test.py"
      - "**/conftest.py"

  variants:
    - language: python
      version_constraint: ">=3.10"

      generic:
        check:
          type: "raw"
          config: |
            rules:
              - id: di-001-python-impl
                languages: [python]
                severity: WARNING
                message: >-
                  Direct dependency instantiation in constructor —
                  use injection instead (DI-001)
                patterns:
                  - pattern-inside: |
                      class $CLS:
                        ...
                        def __init__(self, ...):
                          ...
                  - pattern: self.$FIELD = $DEP(...)
                  # Only class instantiations count: the callee's last dotted
                  # component must be CapWords (httpx.Client, OrderRepository).
                  # Function/method calls (os.environ.get, len, np.asarray) and
                  # value types (Path, Decimal, ...) are not dependencies.
                  - metavariable-regex:
                      metavariable: $DEP
                      regex: ^(?:[A-Za-z_][A-Za-z0-9_]*\.)*(?!(?:Path|PurePath|PosixPath|Decimal|Fraction|UUID|OrderedDict|Counter|ChainMap)$)[A-Z][A-Za-z0-9_]*$
        examples:
          good:
            - language: python
              code: |
                class OrderService:
                    def __init__(self, repo: OrderRepository):
                        self._repo = repo
            - language: python
              code: |
                class OrderService:
                    def __init__(self, repo: OrderRepository, base_dir: str):
                        super().__init__()
                        self._repo = repo
                        self._base_dir = Path(base_dir)
                        self._cache = dict()
            - language: python
              code: |
                import os
                import logging
                import numpy as np

                class Answerer:
                    def __init__(self, docs, base_url: str):
                        self.base_url = base_url.rstrip("/")
                        self.api_key = os.environ.get("API_KEY", "")
                        self.n_docs = len(docs)
                        self.matrix = np.asarray(docs, dtype=float)
                        self.log = logging.getLogger(__name__)
                        self.limit = int(os.environ.get("LIMIT", "10"))
          bad:
            - language: python
              code: |
                class OrderService:
                    def __init__(self):
                        self._repo = OrderRepository()
            - language: python
              code: |
                class OrderService:
                    def __init__(self, config):
                        super().__init__()
                        self._config = config
                        self._client = httpx.Client(timeout=config.timeout)
            - language: python
              code: |
                class Worker:
                    def __init__(self):
                        self._lock = threading.Lock()
            - language: python
              code: |
                class Pipeline:
                    def configure(self):
                        pass

                    def __init__(self, settings):
                        self.settings = settings
                        self.store = storage.backends.S3Store(settings.bucket)

      frameworks:
        - name: django
          version_constraint: ">=4.0"
          check:
            type: "raw"
            config: |
              rules:
                - id: di-001-python-django-impl
                  languages: [python]
                  severity: WARNING
                  message: >-
                    Django view creates service directly in constructor —
                    use injection instead (DI-001)
                  patterns:
                    - pattern-inside: |
                        class $VIEW(View):
                          ...
                          def __init__(self, ...):
                            ...
                    - pattern: self.$SVC = $SVC_CLASS(...)
                    - metavariable-regex:
                        metavariable: $SVC_CLASS
                        regex: ^(?:[A-Za-z_][A-Za-z0-9_]*\.)*[A-Z][A-Za-z0-9_]*$
          examples:
            good:
              - language: python
                code: |
                  class OrderView(View):
                      def __init__(self, order_service: OrderService, **kwargs):
                          super().__init__(**kwargs)
                          self.order_service = order_service
              - language: python
                code: |
                  class OrderView(View):
                      def __init__(self, **kwargs):
                          super().__init__(**kwargs)
                          self.page_size = int(kwargs.get("page_size", 20))
            bad:
              - language: python
                code: |
                  class OrderView(View):
                      def __init__(self, **kwargs):
                          super().__init__(**kwargs)
                          self.order_service = OrderService()
              - language: python
                code: |
                  class OrderView(View):
                      def __init__(self):
                          self.order_service = services.OrderService()

    - language: typescript
      version_constraint: ">=4.0"

      generic:
        check:
          type: "raw"
          config: |
            rules:
              - id: di-001-typescript-impl
                languages: [typescript]
                severity: WARNING
                message: >-
                  Direct dependency instantiation in constructor —
                  use injection instead (DI-001)
                pattern-either:
                  - pattern: |
                      class $CLS {
                        constructor(...) {
                          ...
                          this.$FIELD = new $DEP(...);
                          ...
                        }
                      }
                  - pattern: |
                      class $CLS {
                        $FIELD = new $DEP(...);
                      }
        examples:
          good:
            - language: typescript
              code: |
                class OrderService {
                  constructor(private readonly repo: OrderRepository) {}
                }
            - language: typescript
              code: |
                class OrderService {
                  private repo: OrderRepository;
                  constructor(repo: OrderRepository) {
                    this.repo = repo;
                  }
                }
          bad:
            - language: typescript
              code: |
                class OrderService {
                  private repo: OrderRepository;
                  constructor() {
                    this.repo = new OrderRepository();
                  }
                }
            - language: typescript
              code: |
                class OrderService {
                  private repo: OrderRepository;
                  constructor(private readonly logger: Logger) {
                    this.logger.info('init');
                    this.repo = new OrderRepository();
                  }
                }
            - language: typescript
              code: |
                class OrderService {
                  private readonly repo = new OrderRepository();
                }

      frameworks:
        - name: angular
          version_constraint: ">=14.0"
          check:
            type: "raw"
            config: |
              rules:
                - id: di-001-typescript-angular-impl
                  languages: [typescript]
                  severity: WARNING
                  message: >-
                    Angular service creates dependency directly —
                    use Angular DI instead (DI-001)
                  pattern-either:
                    - pattern: |
                        @Injectable(...)
                        class $CLS {
                          constructor(...) {
                            ...
                            this.$FIELD = new $DEP(...);
                            ...
                          }
                        }
                    - pattern: |
                        @Injectable(...)
                        class $CLS {
                          $FIELD = new $DEP(...);
                        }
          examples:
            good:
              - language: typescript
                code: |
                  @Injectable({ providedIn: 'root' })
                  class OrderService {
                    constructor(private readonly repo: OrderRepository) {}
                  }
            bad:
              - language: typescript
                code: |
                  @Injectable({ providedIn: 'root' })
                  class OrderService {
                    constructor() {
                      this.repo = new OrderRepository();
                    }
                  }
              - language: typescript
                code: |
                  @Injectable({ providedIn: 'root' })
                  class OrderService {
                    private readonly repo = new OrderRepository();
                  }
