schema_version: 2

pattern:
  id: "ARCH-001"
  title: "HTTP calls require resilience wrappers"
  description: |
    All outbound HTTP calls must be wrapped in a resilience construct (circuit breaker,
    retry policy, or approved decorator).
  rationale: |
    Prevents cascading failures and ensures consistent retry/backoff behavior.
  version: "1.0.0"
  tier: 1
  category: "resilience"
  severity: "error"
  tags:
    - reliability
    - http
    - circuit-breaker
  reporting:
    default_message: "HTTP call outside resilience wrapper (ARCH-001)"
    confidence: "high"
  references:
    - "https://example.com/architecture/http-resilience"
  status: "active"

  variants:
    - language: python
      generic:
        check:
          type: "must_wrap"
          target:
            - "requests.get"
            - "requests.post"
            - "requests.put"
            - "requests.patch"
            - "requests.delete"
            - "requests.head"
            - "requests.request"
            - "httpx.get"
            - "httpx.post"
            - "httpx.put"
            - "httpx.patch"
            - "httpx.delete"
            - "httpx.head"
            - "httpx.request"
          wrapper:
            - "circuit_breaker"
            - "with_retry"
            - "@resilient"
        examples:
          good:
            - language: python
              code: |
                with circuit_breaker():
                    requests.get(url)
            - language: python
              code: |
                with with_retry(max_attempts=3):
                    httpx.post(url, json=payload)
            - language: python
              code: |
                @resilient
                def fetch(url):
                    return requests.get(url)
            - language: python
              code: |
                client = httpx.Client(timeout=5)
          bad:
            - language: python
              code: |
                requests.get(url)
            - language: python
              code: |
                httpx.get(url)
            - language: python
              code: |
                def fetch(url):
                    return requests.post(url, json=payload)
