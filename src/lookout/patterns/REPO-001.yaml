schema_version: 2

pattern:
  id: "REPO-001"
  title: "Repository Pattern for Data Access"
  description: |
    All database and data store access should go through repository classes.
    Raw queries, ORM calls, and direct database operations must not appear
    in service, controller, or handler code.
  rationale: |
    The repository pattern decouples business logic from data access
    implementation details, making it possible to swap storage backends,
    test with in-memory fakes, and maintain a clean separation of concerns.
  version: "1.0.0"
  tier: 2
  category: "architecture"
  subcategory: "repository-pattern"
  severity: "warning"
  tags:
    - data-access
    - separation-of-concerns
    - testability

  reporting:
    default_message: "Direct data access outside repository class — use a repository instead (REPO-001)"
    confidence: "medium"

  references:
    - "https://martinfowler.com/eaaCatalog/repository.html"
    - "https://www.cosmicpython.com/book/chapter_02_repository.html"

  status: "active"
  paths:
    exclude:
      - "**/repositories/**"
      - "**/repository/**"
      - "**/*_repository.py"
      - "**/*repository.py"
      - "**/*.repository.ts"
      - "**/dao/**"
      - "**/data/**"
      - "**/migrations/**"
      - "**/alembic/**"
      - "tests/**"
      - "test/**"
      - "**/test_*.py"
      - "**/*_test.py"
      - "**/conftest.py"

  variants:
    - language: python
      version_constraint: ">=3.10"

      generic:
        check:
          type: "raw"
          config: |
            rules:
              - id: repo-001-python-impl
                languages: [python]
                severity: WARNING
                message: >-
                  Direct data access outside repository class —
                  use a repository instead (REPO-001)
                patterns:
                  - pattern-either:
                      - pattern: $DB.execute(...)
                      - pattern: $DB.executemany(...)
                      - pattern: $DB.query(...)
                      - pattern: $DB.add(...)
                      - pattern: $DB.delete(...)
                  # Only receivers that look like a DB handle (session, db, conn, cursor...).
                  - metavariable-regex:
                      metavariable: $DB
                      regex: (?i)(^|.*[._])(session|db|database|conn|connection|cursor|engine)$
                  - pattern-not-inside:
                      patterns:
                        - pattern: |
                            class $REPO:
                              ...
                        - metavariable-regex:
                            metavariable: $REPO
                            regex: (?i).*repository$
        examples:
          good:
            - language: python
              code: |
                class OrderRepository:
                    def find_by_id(self, order_id: str) -> Order:
                        return self._session.query(Order).get(order_id)

                class OrderService:
                    def __init__(self, repo: OrderRepository):
                        self._repo = repo

                    def get_order(self, order_id: str) -> Order:
                        return self._repo.find_by_id(order_id)
            - language: python
              code: |
                class TagService:
                    def tag(self, name: str) -> None:
                        self._tags.add(name)
                        self._queue.delete(name)
          bad:
            - language: python
              code: |
                class OrderService:
                    def get_order(self, order_id: str) -> Order:
                        return self._session.query(Order).get(order_id)
            - language: python
              code: |
                def list_orders(conn):
                    cursor = conn.cursor()
                    cursor.execute("SELECT * FROM orders")
                    return cursor.fetchall()
            - language: python
              code: |
                class OrderHandler:
                    def handle(self, order: Order) -> None:
                        self.db.add(order)

      frameworks:
        - name: sqlalchemy
          version_constraint: ">=2.0"
          check:
            type: "raw"
            config: |
              rules:
                - id: repo-001-python-sqlalchemy-impl
                  languages: [python]
                  severity: WARNING
                  message: >-
                    SQLAlchemy session used outside repository class —
                    use a repository instead (REPO-001)
                  patterns:
                    - pattern-either:
                        - pattern: $SESSION.query(...)
                        - pattern: $SESSION.execute(...)
                        - pattern: $SESSION.add(...)
                        - pattern: $SESSION.add_all(...)
                        - pattern: $SESSION.delete(...)
                        - pattern: $SESSION.scalars(...)
                    - metavariable-regex:
                        metavariable: $SESSION
                        regex: (?i)(^|.*[._])(session|db_session|db)$
                    - pattern-not-inside:
                        patterns:
                          - pattern: |
                              class $REPO:
                                ...
                          - metavariable-regex:
                              metavariable: $REPO
                              regex: (?i).*repository$
          examples:
            good:
              - language: python
                code: |
                  class OrderRepository:
                      def save(self, order: Order) -> None:
                          self._session.add(order)
              - language: python
                code: |
                  class UserRepository:
                      def all(self) -> list[User]:
                          return list(self.session.scalars(select(User)))
            bad:
              - language: python
                code: |
                  class OrderService:
                      def save_order(self, order: Order) -> None:
                          self._session.add(order)
              - language: python
                code: |
                  def get_user(session, user_id):
                      return session.execute(select(User).where(User.id == user_id)).one()

    - language: typescript
      version_constraint: ">=4.0"

      generic:
        check:
          type: "raw"
          config: |
            rules:
              - id: repo-001-typescript-impl
                languages: [typescript]
                severity: WARNING
                message: >-
                  Direct data access outside repository class —
                  use a repository instead (REPO-001)
                patterns:
                  - pattern-either:
                      - pattern: $DB.query(...)
                      - pattern: $DB.execute(...)
                  - metavariable-regex:
                      metavariable: $DB
                      regex: (?i)(^|.*[._])(session|db|database|conn|connection|cursor|pool|knex)$
                  - pattern-not-inside:
                      patterns:
                        - pattern: |
                            class $REPO { ... }
                        - metavariable-regex:
                            metavariable: $REPO
                            regex: (?i).*repository$
        examples:
          good:
            - language: typescript
              code: |
                class OrderRepository {
                  async findById(id: string): Promise<Order> {
                    return this.db.query('SELECT * FROM orders WHERE id = $1', [id]);
                  }
                }
            - language: typescript
              code: |
                class SearchService {
                  search(term: string) {
                    return this.index.query(term);
                  }
                }
          bad:
            - language: typescript
              code: |
                class OrderService {
                  async getOrder(id: string): Promise<Order> {
                    return this.db.query('SELECT * FROM orders WHERE id = $1', [id]);
                  }
                }
            - language: typescript
              code: |
                export async function listOrders(pool: Pool) {
                  const { rows } = await pool.query('SELECT * FROM orders');
                  return rows;
                }
